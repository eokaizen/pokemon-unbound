name: Build pokemon-unbound
on:
  push:
    tags: [\'v*\'] # quando você criar uma tag v1.0.0
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable

      - run: npm install
        working-directory: launcher
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher
          tagName: v1.0.0
          releaseName: "pokemon-unbound v1.0.0"
          releaseBody: "Baixe o Setup.exe, coloque sua ROM 32MB em /game/ e jogue."
          releaseDraft: false
          args: --bundles nsis
